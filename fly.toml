app = "rytex-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  DB_PATH = "/data/rytex.db"

# Kalıcı SQLite deposu — bu volume olmadan makine restart'ında DB uçar.
# Oluştur: fly volumes create rytex_data --size 1 -a rytex-backend -r fra
[mounts]
  source = "rytex_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Makine bosta kapanmaya devam ETMESIN: soguk baslatma olculdu, 6,6 sn.
  # SPARK listesi acilista birden fazla istek yapiyor ve o gecikme istemci
  # tarafinda "SPARK yok" olarak goruluyordu (2026-08-21). Bir makine hep
  # ayakta: shared-cpu-1x / 256MB ~ $2/ay, $10 kill-switch esiginin altinda.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
